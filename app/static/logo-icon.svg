<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="yoomo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="yoomo-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#yoomo-grad)" filter="url(#glow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>

  <!-- Futuristic "Y" Icon Mark with Growth Vector -->
  <!-- Left Wing -->
  <path d="M14 13L24 25" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Wing with Arrow Accent -->
  <path d="M34 13L24 25" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stem -->
  <path d="M24 25V35" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Dynamic Growth Spark Dot / Orbit Node -->
  <circle cx="34" cy="13" r="3.2" fill="url(#yoomo-accent)"/>
  <circle cx="14" cy="13" r="2.2" fill="#FFFFFF" opacity="0.9"/>
</svg>
