{% extends "base.html" %}

{% block title %}Sign in to SMM PRIME{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-140px)] flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
    <!-- SMM PRIME Logo Header -->
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center mb-6">
        <a href="/" class="inline-flex items-center justify-center mb-3">
            <div class="w-10 h-10 rounded-lg bg-[#238636] flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-bolt text-lg"></i>
            </div>
        </a>
        <h1 class="text-2xl font-bold tracking-tight text-[#f0f6fc]">
            Sign in to SMM PRIME
        </h1>
        <p class="text-xs text-[#8b949e] mt-1">Access your reseller account & order dashboard</p>
    </div>

    <div class="w-full max-w-[340px] space-y-4" x-data="{
        username: '',
        password: '',
        showPassword: false,
        loading: false,
        error: '',
        async handleLogin() {
            if (!this.username || !this.password) {
                this.error = 'Please fill in all fields';
                return;
            }
            this.loading = true;
            this.error = '';

            try {
                const res = await fetch('/auth/login-json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: this.username,
                        password: this.password
                    })
                });

                let data = null;
                let textBody = '';
                try {
                    data = await res.json();
                } catch(parseErr) {
                    try { textBody = await res.text(); } catch(e) {}
                }

                if (!data) {
                    this.error = `Server error (${res.status}): ${textBody || res.statusText || 'Please try again.'}`;
                    return;
                }

                if (res.ok && data.success) {
                    showToast('Login successful! Redirecting to workspace...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    let errMsg = 'Incorrect username or password.';
                    if (typeof data.detail === 'string') {
                        errMsg = data.detail;
                    } else if (Array.isArray(data.detail) && data.detail.length > 0) {
                        errMsg = data.detail.map(d => d.msg || d.loc?.join('.')).join(', ');
                    } else if (data.error) {
                        errMsg = data.error;
                    }
                    this.error = errMsg;
                }
            } catch (err) {
                console.error('Login fetch error:', err);
                this.error = 'Network connection failed. Please check your internet connection or verify the server status.';
            } finally {
                this.loading = false;
            }
        }
    }">
        <!-- Error Banner (GitHub Flash Error) -->
        <div x-show="error" x-cloak class="p-3 rounded-md bg-[rgba(218,54,51,0.15)] border border-[rgba(248,81,73,0.35)] text-[#f85149] text-xs flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span x-text="error"></span>
            </div>
            <button type="button" @click="error = ''" class="text-[#f85149] hover:text-[#f0f6fc]">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- GitHub Main Login Box -->
        <div class="p-5 rounded-md bg-[#161b22] border border-[#30363d] shadow-sm">
            <form @submit.prevent="handleLogin" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-[#f0f6fc] mb-1.5">Username or email address</label>
                    <input type="text" x-model="username" required autofocus class="gh-input" placeholder="user@example.com">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-[#f0f6fc]">Password</label>
                        <a href="/support" class="text-[11px] text-[#58a6ff] hover:underline">Forgot password?</a>
                    </div>
                    <div class="relative">
                        <input :type="showPassword ? 'text' : 'password'" x-model="password" required maxlength="72" class="gh-input pr-8" placeholder="••••••••">
                        <button type="button" @click="showPassword = !showPassword" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#8b949e] hover:text-[#f0f6fc] text-xs">
                            <i :class="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" :disabled="loading" class="gh-btn-primary w-full py-1.5 text-center text-xs font-semibold disabled:opacity-50">
                    <span x-show="!loading">Sign in</span>
                    <span x-show="loading"><i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Signing in...</span>
                </button>
            </form>
        </div>

        <!-- Create Account Box -->
        <div class="p-4 rounded-md bg-[#161b22] border border-[#30363d] text-center text-xs text-[#c9d1d9]">
            New to SMM PRIME? 
            <a href="/register" class="text-[#58a6ff] hover:underline font-semibold ml-1">Create an account.</a>
        </div>

        <!-- Footer Links -->
        <div class="pt-6 text-center text-[11px] text-[#8b949e] flex justify-center gap-4">
            <a href="/services-list" class="hover:text-[#58a6ff]">Services</a>
            <a href="/api-docs" class="hover:text-[#58a6ff]">API Docs</a>
            <a href="/support" class="hover:text-[#58a6ff]">Contact Support</a>
        </div>
    </div>
</div>
{% endblock %}
