{% extends "dashboard_layout.html" %}

{% block title %}Ticket #{{ ticket_id }} | SMM PRIME{% endblock %}

{% block dashboard_content %}
<div class="max-w-4xl mx-auto space-y-4" x-data="{
    ticketId: parseInt('{{ ticket_id }}'),
    ticket: null,
    replyText: '',
    submitting: false,
    loading: true,

    async fetchTicket() {
        try {
            const res = await fetch(`/tickets/${this.ticketId}`);
            const data = await res.json();
            if (data.success) {
                this.ticket = data.ticket;
            }
        } catch(e) {
            console.error(e);
        } finally {
            this.loading = false;
        }
    },

    async sendReply() {
        if (!this.replyText.trim()) return;
        this.submitting = true;
        try {
            const res = await fetch(`/tickets/${this.ticketId}/reply`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: this.replyText })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast('Reply sent successfully!', 'success');
                this.replyText = '';
                this.fetchTicket();
            }
        } catch(e) {
            showToast('Failed to send reply', 'error');
        } finally {
            this.submitting = false;
        }
    },

    async closeTicket() {
        if (!confirm('Are you sure you want to close this ticket?')) return;
        try {
            const res = await fetch(`/tickets/${this.ticketId}/close`, { method: 'POST' });
            const data = await res.json();
            if (res.ok && data.success) {
                showToast('Ticket closed', 'info');
                this.fetchTicket();
            }
        } catch(e) {
            showToast('Failed to close ticket', 'error');
        }
    },

    init() {
        this.fetchTicket();
    }
}">
    <!-- Navigation Back Link -->
    <div class="flex items-center justify-between pb-2 border-b border-[#30363d]">
        <a href="/support" class="text-xs text-[#58a6ff] hover:underline flex items-center gap-1.5 font-medium">
            <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to all tickets
        </a>

        <template x-if="ticket && ticket.status !== 'Closed'">
            <button @click="closeTicket()" class="gh-btn-danger text-xs py-1">
                <i class="fa-solid fa-circle-xmark text-xs"></i> Close Ticket
            </button>
        </template>
    </div>

    <!-- Issue Header -->
    <template x-if="ticket">
        <div class="space-y-4">
            <div class="pb-3 border-b border-[#30363d]">
                <h1 class="text-xl sm:text-2xl font-bold text-[#f0f6fc] tracking-tight">
                    <span x-text="ticket.subject"></span>
                    <span class="text-[#8b949e] font-light" x-text="'#' + ticket.id"></span>
                </h1>
                <div class="flex items-center gap-2.5 mt-2 flex-wrap text-xs">
                    <span :class="ticket.status === 'Closed' ? 'gh-badge-closed' : 'gh-badge-open'">
                        <i :class="ticket.status === 'Closed' ? 'fa-solid fa-circle-xmark' : 'fa-solid fa-circle-dot'"></i>
                        <span x-text="ticket.status"></span>
                    </span>
                    <span class="gh-badge-draft text-[11px]" x-text="ticket.category"></span>
                    <span class="text-[#8b949e] font-mono" x-text="'opened on ' + new Date(ticket.created_at).toLocaleDateString()"></span>
                    <span x-show="ticket.order_id" class="text-[#58a6ff] font-mono text-[11px]" x-text="'Linked to Order #' + ticket.order_id"></span>
                </div>
            </div>

            <!-- GitHub Timeline Thread -->
            <div class="space-y-4">
                <template x-for="m in ticket.messages" :key="m.id">
                    <div class="gh-box overflow-hidden">
                        <!-- Comment Header -->
                        <div class="gh-box-header flex items-center justify-between text-xs py-2 px-3.5 bg-[#161b22]">
                            <div class="flex items-center gap-2">
                                <div class="w-5 h-5 rounded-full bg-[#21262d] border border-[#30363d] text-center font-mono font-bold text-[10px] text-[#58a6ff] flex items-center justify-center">
                                    <span x-text="m.username[0].toUpperCase()"></span>
                                </div>
                                <span class="font-bold text-[#f0f6fc]" x-text="m.username"></span>
                                <span class="text-[#8b949e] font-mono text-[11px]" x-text="'commented ' + new Date(m.created_at).toLocaleString()"></span>
                            </div>
                            <span x-show="m.is_staff" class="text-[10px] font-mono font-semibold px-1.5 py-0.2 rounded border border-[#58a6ff]/40 text-[#58a6ff] bg-[#1f6feb]/10">
                                Staff
                            </span>
                        </div>
                        <!-- Comment Body -->
                        <div class="p-4 text-xs text-[#c9d1d9] whitespace-pre-wrap leading-relaxed font-sans" x-text="m.message"></div>
                    </div>
                </template>
            </div>

            <!-- Add Reply Editor -->
            <template x-if="ticket.status !== 'Closed'">
                <div class="gh-box p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-semibold text-[#f0f6fc]">Reply to Ticket</label>
                    </div>
                    <textarea x-model="replyText" rows="4" placeholder="Type your message here..." class="gh-input font-mono text-xs p-3"></textarea>
                    <div class="flex justify-end gap-2">
                        <button @click="sendReply()" :disabled="submitting || !replyText.trim()" class="gh-btn-primary text-xs py-1.5 px-4 disabled:opacity-50">
                            <span x-show="!submitting">Send Reply</span>
                            <span x-show="submitting"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Sending...</span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </template>
</div>
{% endblock %}
