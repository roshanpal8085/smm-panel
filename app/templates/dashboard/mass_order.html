{% extends "dashboard_layout.html" %}

{% block title %}Mass Order | SMM PRIME{% endblock %}

{% block dashboard_content %}
<div class="max-w-4xl mx-auto space-y-4" x-data="{
    ordersData: '',
    loading: false,
    results: null,
    error: '',

    loadSample() {
        this.ordersData = '1|1000|https://instagram.com/p/sample1\n1|2000|https://instagram.com/p/sample2';
    },

    async submitMassOrder() {
        if (!this.ordersData.trim()) {
            this.error = 'Please enter at least one order line.';
            return;
        }

        this.loading = true;
        this.error = '';
        this.results = null;

        try {
            const res = await fetch('/orders/mass', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    orders_data: this.ordersData
                })
            });

            const data = await res.json();
            if (res.ok && data.success) {
                this.results = data;
                showToast(`Processed ${data.total} orders (${data.success_count} successful)`, 'success');
            } else {
                this.error = data.detail || data.error || 'Failed to process mass orders';
            }
        } catch(e) {
            this.error = 'Network error during submission.';
        } finally {
            this.loading = false;
        }
    }
}">
    <!-- Header -->
    <div class="flex items-center justify-between pb-3 border-b border-[#30363d]">
        <div>
            <div class="flex items-center gap-2 text-xs text-[#8b949e]">
                <span>Dashboard</span>
                <span>/</span>
                <span class="text-[#f0f6fc]">Mass Order</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-[#f0f6fc] tracking-tight mt-0.5">Mass Order</h1>
        </div>
        <button type="button" @click="loadSample()" class="gh-btn text-xs">
            <i class="fa-solid fa-code text-[#8b949e]"></i> Load Sample Format
        </button>
    </div>

    <!-- Error Banner -->
    <div x-show="error" x-cloak class="p-3 rounded-md bg-[rgba(218,54,51,0.15)] border border-[rgba(248,81,73,0.35)] text-[#f85149] text-xs flex items-center justify-between">
        <span x-text="error"></span>
        <button @click="error = ''"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="gh-box p-5 space-y-4">
        <div>
            <div class="flex items-center justify-between mb-2">
                <label class="block text-xs font-semibold text-[#f0f6fc]">
                    Order Payload Format: <code class="font-mono text-[#58a6ff] bg-[#161b22] px-1.5 py-0.5 rounded border border-[#30363d]">service_id|quantity|target_url</code>
                </label>
                <a href="/services-page" class="text-xs text-[#58a6ff] hover:underline font-mono">Service IDs &rarr;</a>
            </div>
            <textarea x-model="ordersData" rows="8" placeholder="1|1000|https://instagram.com/p/sample1&#10;2|500|https://instagram.com/p/sample2" class="gh-input font-mono text-xs p-3 leading-relaxed" style="resize: vertical;"></textarea>
            <p class="text-[11px] text-[#8b949e] mt-1.5 font-mono">One order per line separated by pipe symbol (<code class="text-[#f0f6fc]">|</code>).</p>
        </div>

        <button type="button" @click="submitMassOrder()" :disabled="loading" class="gh-btn-primary w-full py-2.5 text-xs font-semibold disabled:opacity-50">
            <span x-show="!loading"><i class="fa-solid fa-layer-group mr-1.5"></i> Submit Mass Order</span>
            <span x-show="loading"><i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Processing Orders...</span>
        </button>
    </div>

    <!-- Results Section -->
    <div x-show="results" x-cloak class="gh-box">
        <div class="gh-box-header flex items-center justify-between">
            <span class="text-xs font-semibold text-[#f0f6fc]">Mass Order Summary</span>
            <div class="flex items-center gap-2 text-xs font-mono">
                <span class="gh-badge-open text-[11px]" x-text="'Success: ' + results.success_count"></span>
                <span class="gh-badge-closed text-[11px]" x-text="'Failed: ' + results.fail_count"></span>
            </div>
        </div>

        <div class="divide-y divide-[#21262d] max-h-80 overflow-y-auto">
            <template x-for="r in results.results" :key="r.line">
                <div class="gh-box-row flex items-center justify-between text-xs py-2.5">
                    <div class="flex items-center gap-3">
                        <span class="font-mono text-[#8b949e]" x-text="'Line ' + r.line"></span>
                        <span :class="r.status === 'success' ? 'text-[#3fb950] font-semibold font-mono' : 'text-[#f85149] font-mono'" x-text="r.status === 'success' ? 'Order #' + r.order_id + ' (₹' + r.charge + ')' : r.error"></span>
                    </div>
                    <span :class="r.status === 'success' ? 'gh-badge-open' : 'gh-badge-closed'" class="text-[10px] font-mono" x-text="r.status"></span>
                </div>
            </template>
        </div>
    </div>
</div>
{% endblock %}
