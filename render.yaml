services:
  - type: web
    name: yoomo
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Yoomo
      - key: APP_URL
        value: https://yoomo.in
      - key: APP_ENV
        value: production
      - key: DEFAULT_CURRENCY
        value: INR
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: CORS_ORIGINS
        value: "https://yoomo.in,https://www.yoomo.in"
      - key: DATABASE_URL
        fromDatabase:
          name: smm-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: smm-postgres
    plan: free
    databaseName: smm_panel
    user: smm_user
